{%extends 'base.html'%}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{%static 'css/transaction.css'%}">
{% endblock extra_css %}

{% block content %}
<div class="dashboard-layout">
        <!-- Main Content -->
        <div class="main-wrapper">
            <div class="app-container">
                <div class="header">
                    <div class="logo-area">
                        <h1>Wafarly Shokran</h1>
                        <p> for Personal Finance</p>
                    </div>
                </div>
                <main class="main-content">
                    <div class="filter-bar">
                        <div class="search-box">
                            <span class="search-icon"></span>
                            <input type="text" class="search-input" placeholder="Search transaction">
                        </div>
                        <div class="filter-controls">
                            <select class="filter-select">
                                <option>Housing</option>
                                <option>Food</option>
                                <option>Shopping</option>
                                <option>Transportation</option>
                            </select>
                            <button class="add-btn" id="openModal">+ Add Transaction</button>
                        </div>
                    </div>
                    
                    <div class="table-wrapper">
                        <table class="transactions-table">
                            <thead>
                                <tr>
                                    <th>DATE</th>
                                    <th>DESCRIPTION</th>
                                    <th>CATEGORY</th>
                                    <th>AMOUNT</th>
                                    <th class="actions-header">ACTIONS</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </main>
            </div>
        </div>
    </div>
    
    
    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2>Add Transaction</h2>
            
            <div class="type-selector">
                <button id="incomeBtn" class="type-btn income active-type">+ Income</button>
                <button id="expenseBtn" class="type-btn expense">- Expense</button>
            </div>
            
            <form id="transactionForm">
                <input type="text" placeholder="Description" required>
                <input type="number" placeholder="Amount" required>
                
                <select id="categorySelect"></select>
                
                <button type="submit" class="add-btn">Save</button>
            </form>
        </div>
    </div>
    {% block extra_js %}
    <script src="{% static 'js/transaction.js' %}"></script>
    {% endblock extra_js %}
{% endblock content %}

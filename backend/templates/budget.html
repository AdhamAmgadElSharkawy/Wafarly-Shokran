{%extends 'base.html'%}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{%static 'css/budget.css'%}">
{% endblock extra_css %}

{% block content %}
<section class="budget-main-container">
    
    <div class="budget-header">
        <h1>Budgets</h1>
        <p>Control your spending, set monthly limits.</p>
    </div>
    
    
    <div class="budget-form-card">
        <div class="form-header">
            <h2 id="formTitle"><span>+</span> Create New Budget</h2>
        </div>
        
        <form class="budget-form" id="budgetForm">
            <div class="form-group">
                <label for="categorySelect">Spending Category *</label>
                <select id="categorySelect" name="category" required>
                    <option value="" disabled selected>— Select a category —</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="budgetAmount">Budget Amount ($) *</label>
                <input type="number" id="budgetAmount" name="amount" step="1" min="0.00" placeholder="e.g., 300.00"
                required>
                <small class="field-hint">Positive number only</small>
            </div>
            
            <div class="form-group">
                <label for="budgetPeriod">Budget Period (Month & Year)</label>
                <input type="month" id="budgetPeriod" name="period" required>
                <small class="field-hint">Select the month and year for this budget</small>
            </div>
            
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="alertEnabled" name="alertEnabled">
                    <span>Alert when spending reaches 80% of budget</span>
                </label>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary" id="submitBudgetBtn">Create Budget</button>
                <button type="reset" class="btn-secondary" id="resetFormBtn">Clear</button>
            </div>
        </form>
    </div>
</section>
{% endblock content %}

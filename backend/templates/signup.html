{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Signup</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="{%static 'css/signup.css'%}">
    </head>
<div>
    <form method="post" class="wrapper">
        {%csrf_token%}
        <img class = "signupLogo" src="{%static 'images/wallet_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg' %}" alt="logo">
        <h1>Signup</h1>

        {%if error %}
            <p style="color: red; text-align: center; font-weight: bold;">{{ error }}</p>
        {%endif%}

        <div class="inputBox">
            <Label for="fname">First Name:</Label>
            <input type="text" id ="fname" name="first_name" placeholder="Adham" required>
        </div>
        
        <div class="inputBox">
            <Label for="lname">Last Name:</Label>
            <input type="text" id ="lname" name="last_name" placeholder="El-Sharkawy" required>
        </div>
        
        <div class="inputBox">
            <label for = "username">Username:</label>
            <input type = "text" id="username" name="username" placeholder="Adham" required>
        </div>
        <div class="inputBox">
            <label for="birthday">Birthday:</label>
            <input type="date" id="birthday" name="birth_date"  required>
        </div>
        <div class="inputBox">
            <label for="email">Email:</label>
            <input type="email" id="email" name = "email" placeholder="Email" required>
        </div>
        <div class="inputBox">
            <label for="password">Password:</label>
            <input type = "password" id="password" name = "password" placeholder="password" required>
        </div>
        <div class="inputBox">
            <label for="confirmPassword">Confirm Password:</label>
            <input type = "password" id="confirmPassword" name = "confirm_password" placeholder="password" required>
        </div>
        
        <input type = "submit" id="submit" name = "submit" value="signup">
        <a href="{% url 'login' %}">Have Account Already</a>
    </form>
</div>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Budget page</title>
    <link rel="stylesheet" href="../css/sideBar.css">
    <link rel="stylesheet" href="../css/budget.css">
</head>

<body>
    <aside class="SideBar">
        <div class="sidebarLogo">
            <h2>Wafarly Shokran</h2>
            <p>for personal finance</p>
        </div>
        <ul>
            <li class="sideBar-item active">
                <a href="dashboard.html">
                    <span>dashboard</span>
                </a>
            </li>
            <li class="sideBar-item">
                <a href="transaction.html">
                    <span>transactions</span>
                </a>
            </li>
            <li class="sideBar-item">
                <a href="budget.html">
                    <span>Budget</span>
                </a>
            </li>
            <li class="sideBar-item">
                <a href="goals.html">
                    <span>goals</span>
                </a>
            </li>
            <li class="sideBar-item">
                <a href="reports.html">
                    <span>reports</span>
                </a>
            </li>
        </ul>
        <div class="sideBar-footer">
            <a href="signup.html">
                <span>logout</span>
            </a>
        </div>
    </aside>


    <main class="budget-main-container">

        <div class="budget-header">
            <h1>💰 Budgets</h1>
            <p>Control your spending, set monthly limits.</p>
        </div>


        <div class="budget-form-card">
            <div class="form-header">
                <h2 id="formTitle">➕ Create New Budget</h2>
            </div>

            <form class="budget-form" id="budgetForm">
                <div class="form-group">
                    <label for="categorySelect">Spending Category *</label>
                    <select id="categorySelect" name="category" required>
                        <option value="" disabled selected>— Select a category —</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transportation">🚗 Transportation</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Healthcare">🏥 Healthcare</option>
                        <option value="Education">📚 Education</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budgetAmount">Budget Amount ($) *</label>
                    <input type="number" id="budgetAmount" name="amount" step="1" min="0.00" placeholder="e.g., 300.00"
                        required>
                    <small class="field-hint">Positive number only</small>
                </div>

                <div class="form-group">
                    <label for="budgetPeriod">Budget Period (Month & Year)</label>
                    <input type="month" id="budgetPeriod" name="period" required>
                    <small class="field-hint">Select the month and year for this budget</small>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="alertEnabled" name="alertEnabled">
                        <span>🔔 Alert when spending reaches 80% of budget</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="submitBudgetBtn">Create Budget</button>
                    <button type="reset" class="btn-secondary" id="resetFormBtn">Clear</button>
                </div>
            </form>
        </div>

    </main>

</body>

</html>

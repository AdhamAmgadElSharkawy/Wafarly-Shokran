<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Budget Dashboard</title>
        <h1>Dashboard</h1>
    </head>
    <body>
        <main class="dashboard">

            <section class="cards">
                <div class="card">
                    <h3>Monthly Income</h3>
                    <p>4500$</p>
                </div>

                <div class="card">
                    <h3>Savings Rate</h3>
                    <p>34.5%</p>
                </div>

                <div class="card">
                    <h3>Monthly Expenses</h3>
                    <p>2950$</p>
                </div>

                <div class="card">
                    <h3>Total Balance</h3>
                    <p>12,400$</p>
                </div>
            </section>

            <section class="charts">
                <div class="spendingByCategory">
                    <h3>Spending By Category</h3>
                </div>

                <div class="spendingVsBudget">
                    <h3>Spending VS Budget</h3>
                </div>
            </section>

            <section class="activity">
                <div class="recentActivity">
                    <h3>Recent Activity</h3>
                </div>

                <div class="actions">
                    <h3>Actions</h3>
                    <ul>
                        <li>Add Income</li>
                        <li>Add Expense</li>
                        <li>Create Goal</li>
                    </ul>
                </div>
            </section>
        </main>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Transaction</title>
    <link rel="stylesheet" href="../css/Add_trans.css">
</head>

<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <!-- Header -->
            <div class="modal-header">
                <div class="header-left">
                    <a href="transaction.html" class="back-btn">←</a>
                    <h2>Add Transaction</h2>
                </div>
                <a href="transaction.html" class="close-btn">✕</a>
            </div>

            <!-- Form Content -->
            <form class="transaction-form">
                <div class="form-group type-group">
                    <label class="form-label">Type</label>
                    <div class="type-buttons">
                        <button type="button" class="type-btn active">Expense</button>
                        <button type="button" class="type-btn">Income</button>
                    </div>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label class="form-label" for="amount">Amount ($)</label>
                    <input type="number" id="amount" name="amount" class="form-input" step="1" value="0.00">
                    <small class="input-hint">Use negative sign for expenses, positive for income</small>
                </div>

                <!-- Date -->
                <div class="form-group">
                    <label class="form-label" for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input" value="2026-04-26">
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <input type="text" id="description" name="description" class="form-input"
                        placeholder="Enter transaction details...">
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <select id="category" name="category" class="form-select">
                        <option value="">Select a category</option>
                        <option value="Housing">Housing</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Income">Income</option>
                    </select>
                </div>

                <!-- Account -->
                <div class="form-group">
                    <label class="form-label" for="account">Account</label>
                    <select id="account" name="account" class="form-select">
                        <option value="">Select an account</option>
                        <option value="Checking">Checking</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Savings">Savings</option>
                        <option value="Cash">Cash</option>
                    </select>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <a href="transaction.html" class="btn-cancel">Cancel</a>
                    <button type="button" class="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
